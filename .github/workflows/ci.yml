name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["agent/v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: npm ci
      - run: npm --workspace apps/glimt-web run lint
      - run: dotnet format apps/glimt-hub/Glimt.Hub.slnx --verify-no-changes
      - name: gofmt og go vet (i Docker)
        run: docker run --rm -v "$PWD/apps/glimt-agent":/src -w /src golang:1.25 sh -c "test -z \"$(gofmt -l .)\" && go vet ./..."

  # Steg 11.2: kjente sårbarheter i avhengighetene stopper bygget.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: apps/glimt-agent/go.sum }
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: dotnet list package --vulnerable
        run: |
          dotnet restore apps/glimt-hub/Glimt.Hub.slnx
          out=$(dotnet list apps/glimt-hub/Glimt.Hub.slnx package --vulnerable --include-transitive)
          echo "$out"
          ! echo "$out" | grep -q "has the following vulnerable packages"
      - name: govulncheck
        run: cd apps/glimt-agent && go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm --workspace packages/protocol test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: node scripts/web-config.mjs
      - run: npm --workspace apps/glimt-web test -- --watch=false

  test-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet test apps/glimt-hub/Glimt.Hub.slnx --logger "trx;LogFileName=hub.trx"

  test-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: apps/glimt-agent/go.sum }
      - run: cd apps/glimt-agent && go test ./...

  build-images:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: hub
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/glimt-hub/Dockerfile, push: false, cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: web
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/glimt-web/Dockerfile, push: false, cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: site
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/glimt-site/Dockerfile, push: false, cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: agent (systemd-container bygger)
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/glimt-agent/Dockerfile.dev, push: false, cache-from: type=gha, cache-to: type=gha,mode=max }
      - name: agent sidecar (bygger, starter og svarer på version)
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/glimt-agent/Dockerfile.sidecar, push: false, load: true, tags: glimt-agent-sidecar:ci, cache-from: type=gha, cache-to: type=gha,mode=max }
      - run: docker run --rm --entrypoint /glimt-agent glimt-agent-sidecar:ci version
      - name: sidecar under 15 MB
        run: |
          size=$(docker image inspect glimt-agent-sidecar:ci --format '{{.Size}}')
          echo "sidecar image: $size bytes"
          test "$size" -lt 15728640

  # Utgivelse av agenten ved tag agent/v<versjon> (steg 1.11 og 12.4): binærene som release-vedlegg og
  # sidecar-imaget ghcr.io/opdahlmann/glimt-agent:<versjon> + :latest som multi-arch-manifest.
  release-agent:
    if: startsWith(github.ref, 'refs/tags/agent/v')
    runs-on: ubuntu-latest
    needs: [test-agent, build-images]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=${GITHUB_REF_NAME#agent/v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: binærer (linux/amd64, linux/arm64, SHA256SUMS)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/glimt-agent/Dockerfile.build
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=out
          cache-from: type=gha
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: sidecar-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/glimt-agent/Dockerfile.sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/opdahlmann/glimt-agent:${{ steps.version.outputs.version }}
            ghcr.io/opdahlmann/glimt-agent:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: softprops/action-gh-release@v2
        with:
          name: glimt-agent ${{ steps.version.outputs.version }}
          files: |
            out/glimt-agent-linux-amd64
            out/glimt-agent-linux-arm64
            out/SHA256SUMS

  # Steg 11.1: hele suiten i tre prosjekter mot bygget hub (dotnet publish) og bygget web (scripts/serve-web.mjs med
  # nginx-hodene), fire arbeidere, under 15 minutter.
  e2e:
    runs-on: ubuntu-latest
    needs: [test-web, test-hub]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm --workspace e2e test
        env:
          GLIMT_ENV: e2e
          GLIMT_E2E_BUILT: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }
