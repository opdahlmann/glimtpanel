@if (view(); as v) {
  <article class="card">
    <div class="stripe" [style.background]="v.stripe" aria-hidden="true"></div>
    <div class="title">
      <div class="tags">
        @for (tag of v.tags; track tag) {
          <gp-badge>{{ tag }}</gp-badge>
        }
      </div>
      <button type="button" class="name" (click)="open()" [attr.aria-label]="('openServer' | t) + ' ' + v.name">{{ v.name }}</button>
      <div class="status" [class.status--down]="v.status === 'down'">
        <span>{{ v.statusText }}</span>
        <gp-live-dot [state]="v.dot" [pulse]="pulse()" />
      </div>
    </div>
    <div class="info num">{{ v.info }}</div>
    <div class="rings">
      <gp-ring [value]="v.cpu" color="cpu" [label]="'cpu' | t" [sub]="v.cpuSub" (pressed)="openPanel('cpu')" />
      <gp-ring [value]="v.mem" color="ram" [label]="'memory' | t" [sub]="v.memSub" (pressed)="openPanel('mem')" />
      <gp-ring [value]="v.disk" color="disk" [label]="'disk' | t" [sub]="v.diskSub" (pressed)="openPanel('disk')" />
    </div>
    <div class="chips">
      <gp-chip [label]="('net' | t) + ' MB/s'" [value]="v.net" />
      <gp-chip [label]="'containers' | t" [value]="v.containers" [tone]="v.containersTone" />
      <gp-chip [label]="'updates' | t" [value]="v.updates" [tone]="v.updatesTone" />
      <gp-chip [label]="'reboot' | t" [value]="v.reboot" [tone]="v.rebootTone" />
      <gp-chip [label]="'services' | t" [value]="v.services" [tone]="v.servicesTone" />
    </div>
    @if (sparklines()) {
      <div class="sparks">
        <gp-sparkline [values]="hour().cpu" color="cpu" [height]="24" />
        <gp-sparkline [values]="hour().mem" color="ram" [height]="24" />
      </div>
    }
  </article>
}
