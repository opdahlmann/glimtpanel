<a class="skip" href="#main" (click)="skip($event)">{{ 'skipToContent' | t }}</a>
<gp-backdrop />
@if (!isMobile()) {
  <gp-sidebar />
}
<div class="content">
  @if (isMobile()) {
    <gp-topbar />
  }
  @if (pwa.updateReady()) {
    <div class="update" role="status" aria-live="polite" data-testid="update-banner">
      <span class="strong">{{ 'newVersion' | t }}</span>
      <gp-button class="btn" variant="primary" size="sm" (click)="reload()">{{ 'reload' | t }}</gp-button>
    </div>
  }
  @if (conn.offline()) {
    <div class="offline" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span class="strong">{{ 'offline' | t }}</span>
      <span class="sub">{{ 'offlineSub' | t }} <span class="num">{{ frozenAt() }}</span> · {{ 'reconnect' | t }}</span>
      <gp-button class="btn" variant="ghost" size="sm" (click)="reconnect()">{{ 'reconnectBtn' | t }}</gp-button>
    </div>
  }
  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
  @if (showBottomNav()) {
    <gp-bottom-nav />
  }
</div>
<gp-toast-host />
