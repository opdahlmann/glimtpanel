# Sikkerhetshoder for glimt-web (IMPLEMENTERINGSPLAN steg 11.2). Inkluderes i hver location som har egne add_header
# (nginx arver ikke add_header inn i en location som setter sine egne). scripts/serve-web.mjs leser den samme filen,
# så e2e mot bygget web kjører med identiske hoder og fanger opp en CSP som knekker appen.
#
# CSP: Angular setter komponentstiler som inline <style> (style-src 'unsafe-inline'); ingen inline script; SignalR og
# fetch går same-origin (connect-src 'self' dekker også ws/wss mot samme opprinnelse); ikoner og manifest fra self;
# service worker fra self; ingen plugins; kun glimtpanel.com får ramme inn appen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self' https://glimtpanel.com; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
